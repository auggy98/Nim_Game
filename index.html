<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nim Game</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--accent:#3b6ef5;--accent-t:#fff;--border:#d5dbe8;--good:#1b8a4b;--bad:#c93a3a;--soft:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#141821;--card:#1e2430;--text:#e8ecf5;--muted:#9aa4b8;--accent:#6b8fff;--accent-t:#101420;--border:#343c4d;--good:#4cc582;--bad:#ff7b7b;--soft:#28324a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);padding:10px;height:100dvh;overflow:hidden}
.wrap{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column}
h1{margin:0 0 6px;text-align:center;font-size:1.5rem;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;flex:none}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 8px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.tabs button.active{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:8px;flex:none}
.game{flex:1;min-height:0;display:flex;flex-direction:column}
.card h2{margin:0 0 6px;font-size:1.1rem}
.card ol{margin:4px 0 0;padding-left:20px;color:var(--muted);font-size:.9rem}
.card li{margin:1px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:6px 0;flex:none}
.num{font-size:2.6rem;font-weight:700;text-align:center;line-height:1.1;flex:none}
.sub{text-align:center;color:var(--muted);min-height:1.3em;flex:none}
.picks{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:6px;flex:none}
.picks button{font-size:1.05rem;font-weight:600;padding:9px 0;background:var(--soft)}
input[type=number]{font:inherit;width:90px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-align:center}
.hard{background:var(--card)}
.hard.on{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.msg{text-align:center;font-size:1.15rem;font-weight:700;min-height:1.4em;margin:2px 0;flex:none}
.msg.win{color:var(--good)}.msg.lose{color:var(--bad)}
#log{flex:1;min-height:80px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;align-content:start;font-size:.9rem;margin-top:4px}
#log .h{position:sticky;top:0;background:var(--soft);font-weight:700;padding:5px 10px;z-index:1}
#log .e{padding:3px 10px;color:var(--muted);white-space:nowrap}
#log .e.c{border-left:1px solid var(--border)}
#log b{display:inline-block;min-width:2.4em;color:var(--text)}
@media (max-height:520px){body{height:auto;overflow:auto}.wrap{height:auto}#log{min-height:160px}}
@media (max-width:480px){.picks{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>Nim Game</h1>

<div class="tabs" id="tabs">
  <button data-p="1a" class="active">Part 1a</button>
  <button data-p="1b">Part 1b</button>
  <button data-p="2a">Part 2a</button>
  <button data-p="2b">Part 2b</button>
</div>

<div class="card" id="instr"></div>

<div class="card game">
  <div class="row" id="setup" style="display:none">
    <label for="start">Starting number (1–100):</label>
    <input type="number" id="start" min="1" max="100" value="50">
    <button class="primary" id="startBtn">Start game</button>
  </div>
  <div class="sub" id="sub"></div>
  <div class="num" id="num">100</div>
  <div class="msg" id="msg"></div>
  <div class="picks" id="picks"></div>
  <div class="row">
    <button id="undo">↩ Undo</button>
    <button id="restart">⟳ Restart</button>
    <button id="hard" class="hard">Hard mode: OFF</button>
  </div>
  <div id="log"></div>
</div>
</div>

<script>
const INSTR = {
  "1a": ["Part 1a: Start at 100, last to 0 wins", [
    "The game starts at 100.",
    "You go first: subtract a number from 1 to 10 (inclusive).",
    "Then the computer subtracts a number from 1 to 10.",
    "Take turns. Whoever makes the number hit 0 WINS.",
    "Use Undo to take back your last move. Turn on Hard mode to make the computer play the best move."]],
  "1b": ["Part 1b: Choose your start, last to 0 wins", [
    "Choose a starting number from 1 to 100, then press Start game.",
    "You go first: subtract a number from 1 to 10 (inclusive).",
    "Then the computer subtracts a number from 1 to 10.",
    "Take turns. Whoever makes the number hit 0 WINS.",
    "Use Undo to take back your last move. Turn on Hard mode to make the computer play the best move."]],
  "2a": ["Part 2a: Start at 100, hitting 0 loses", [
    "The game starts at 100.",
    "You go first: subtract a number from 1 to 10 (inclusive).",
    "Then the computer subtracts a number from 1 to 10.",
    "Take turns. Whoever makes the number hit 0 LOSES.",
    "Use Undo to take back your last move. Turn on Hard mode to make the computer play the best move."]],
  "2b": ["Part 2b: Choose your start, hitting 0 loses", [
    "Choose a starting number from 1 to 100, then press Start game.",
    "You go first: subtract a number from 1 to 10 (inclusive).",
    "Then the computer subtracts a number from 1 to 10.",
    "Take turns. Whoever makes the number hit 0 LOSES.",
    "Use Undo to take back your last move. Turn on Hard mode to make the computer play the best move."]]
};

let part = "1a", n = 100, hard = false, started = true, over = false;
let history = [];      // snapshots before each student move: {n, logLen}
let logItems = [];     // log entries
let memo = {};         // remembers computer replies so undo + same move => same reply

const $ = id => document.getElementById(id);
const misere = () => part[0] === "2";
const choosable = () => part[1] === "b";

function computerMove(n){
  const key = part + "|" + hard + "|" + n;
  if (memo[key] !== undefined) return memo[key];
  const max = Math.min(10, n);
  let m;
  if (hard){
    // Normal: leave a multiple of 11. Misère: leave 1 more than a multiple of 11.
    const target = misere() ? (n - 1) % 11 : n % 11;
    m = (target >= 1 && target <= max) ? target : 1 + Math.floor(Math.random() * max);
  } else {
    m = 1 + Math.floor(Math.random() * max);
  }
  memo[key] = m;
  return m;
}

function endText(who){
  // who = the player who made the number hit 0
  const playerHit = who === "You";
  const playerWins = misere() ? !playerHit : playerHit;
  return playerWins;
}

function studentMove(k){
  if (over || !started || k > n) return;
  history.push({n, logLen: logItems.length});
  n -= k;
  logItems.push("You subtract " + k + " → " + n);
  if (n === 0){ finish("You"); return render(); }
  const c = computerMove(n);
  n -= c;
  // memo is keyed by state before the computer moves (n after the student's move)
  logItems.push("Computer subtracts " + c + " → " + n);
  if (n === 0) finish("Computer");
  render();
}

function finish(who){
  over = true;
  const win = endText(who);
  $("msg").textContent = win ? "🎉 You win!" : "💻 Computer wins!";
  $("msg").className = "msg " + (win ? "win" : "lose");
}

function undo(){
  if (!history.length) return;
  const s = history.pop();
  n = s.n;
  logItems.length = s.logLen;
  over = false;
  $("msg").textContent = ""; $("msg").className = "msg";
  render();
}

function newGame(){
  n = choosable() ? (parseInt($("start").value) || 50) : 100;
  n = Math.max(1, Math.min(100, n));
  history = []; logItems = []; memo = {}; over = false;
  started = true;
  $("msg").textContent = ""; $("msg").className = "msg";
  render();
}

function selectPart(p){
  part = p;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.p === p));
  const [title, steps] = INSTR[p];
  $("instr").innerHTML = "<h2>" + title + "</h2><ol>" + steps.map(s => "<li>" + s + "</li>").join("") + "</ol>";
  $("setup").style.display = choosable() ? "flex" : "none";
  if (choosable()){
    started = false; history = []; logItems = []; memo = {}; over = false;
    n = 0;
    $("msg").textContent = ""; $("msg").className = "msg";
    render();
  } else newGame();
}

function render(){
  $("num").textContent = started ? n : "–";
  $("sub").textContent = !started ? "Choose a starting number above and press Start game."
    : over ? "Game over." : "Your turn: subtract 1–10";
  const picks = $("picks");
  picks.innerHTML = "";
  for (let k = 1; k <= 10; k++){
    const b = document.createElement("button");
    b.textContent = k;
    b.disabled = !started || over || k > n;
    b.onclick = () => studentMove(k);
    picks.appendChild(b);
  }
  $("undo").disabled = history.length === 0;
  $("hard").textContent = "Hard mode: " + (hard ? "ON" : "OFF");
  $("hard").classList.toggle("on", hard);
  $("log").innerHTML = '<div class="h" style="grid-column:1;grid-row:1">You</div><div class="h" style="grid-column:2;grid-row:1">Computer</div>' +
    logItems.map((t, i) => {
      const col = i % 2 === 0 ? 1 : 2;           // odd steps (you) left, even steps (computer) right
      const row = Math.floor(i / 2) + 2;
      return '<div class="e' + (col === 2 ? ' c' : '') + '" style="grid-column:' + col + ';grid-row:' + row + '"><b>' + (i + 1) + '.</b> ' + t + '</div>';
    }).join("");
  $("log").scrollTop = $("log").scrollHeight;
}

$("tabs").addEventListener("click", e => { if (e.target.dataset.p) selectPart(e.target.dataset.p); });
$("startBtn").onclick = () => {
  const v = parseInt($("start").value);
  if (!(v >= 1 && v <= 100)){ alert("Please enter a number from 1 to 100."); return; }
  newGame();
};
$("undo").onclick = undo;
$("restart").onclick = () => choosable() ? (started = false, n = 0, history = [], logItems = [], over = false, $("msg").textContent = "", render()) : newGame();
$("hard").onclick = () => { hard = !hard; render(); };

selectPart("1a");
</script>
</body>
</html>
